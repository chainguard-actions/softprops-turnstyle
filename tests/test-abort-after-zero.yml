name: Test abort-after-seconds zero
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          abort-after-seconds: "0"
      - name: Assert action aborted
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FORCED: ${{ steps.action.outputs.force_continued }}
        run: |
          echo "outcome: $OUTCOME"
          echo "force_continued: '$FORCED'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the step to fail when aborting after 0 seconds"
            exit 1
          fi
          if [ -n "$FORCED" ]; then
            echo "FAIL: expected force_continued to be empty on abort"
            exit 1
          fi
          echo "PASS"
