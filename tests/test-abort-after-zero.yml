name: Test abort-after-seconds 0 aborts
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          abort-after-seconds: "0"
      - name: Assert step failed and did not force-continue
        env:
          FORCE: ${{ steps.action.outputs.force_continued }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "force_continued: '$FORCE'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the action to abort with failure"
            exit 1
          fi
          if [ -n "$FORCE" ]; then
            echo "FAIL: expected force_continued to be empty on abort"
            exit 1
          fi
          echo "PASS"
