name: Test invalid poll-interval-seconds is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          poll-interval-seconds: "abc"
          continue-after-seconds: "0"
      - name: Assert step failed on invalid input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FORCE: ${{ steps.action.outputs.force_continued }}
        run: |
          echo "outcome: $OUTCOME"
          echo "force_continued: '$FORCE'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for non-integer poll-interval-seconds"
            exit 1
          fi
          if [ -n "$FORCE" ]; then
            echo "FAIL: input validation should fail before deadline handling"
            exit 1
          fi
          echo "PASS"
