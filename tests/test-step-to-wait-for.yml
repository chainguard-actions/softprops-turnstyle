name: Test step-to-wait-for input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          poll-interval-seconds: '10'
          abort-after-seconds: '30'
          same-branch-only: 'false'
          job-to-wait-for: 'test'
          step-to-wait-for: 'Run tests'
      - name: Assert action ran with step-to-wait-for
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FORCE_CONTINUED: ${{ steps.action.outputs.force_continued }}
        run: |
          echo "outcome: $OUTCOME"
          echo "force_continued: $FORCE_CONTINUED"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (no competing runs with matching job/step found)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo not resolvable or timed out)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
