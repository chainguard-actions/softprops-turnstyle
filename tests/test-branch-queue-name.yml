name: Test custom branch and queue-name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          poll-interval-seconds: "2"
          abort-after-seconds: "30"
          same-branch-only: "true"
          branch: main
          queue-name: test-queue
      - name: Assert action ran (succeeded, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FORCED: ${{ steps.action.outputs.force_continued }}
          PREV_ID: ${{ steps.action.outputs.previous_run_id }}
          PREV_URL: ${{ steps.action.outputs.previous_run_url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "force_continued: '$FORCED'"
          echo "previous_run_id: '$PREV_ID'"
          echo "previous_run_url: '$PREV_URL'"
          if [ "$OUTCOME" = "success" ]; then
            if [ -n "$FORCED" ]; then
              echo "FAIL: force_continued must be empty without continue-after-seconds"
              exit 1
            fi
            if [ -n "$PREV_ID" ] && ! echo "$PREV_ID" | grep -qE '^[0-9]+$'; then
              echo "FAIL: previous_run_id is not numeric"
              exit 1
            fi
            echo "PASS: action completed"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
