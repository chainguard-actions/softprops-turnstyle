name: Test same-branch-only false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          poll-interval-seconds: '5'
          abort-after-seconds: '10'
          same-branch-only: 'false'
      - name: Assert action ran with same-branch-only=false
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FORCE_CONTINUED: ${{ steps.action.outputs.force_continued }}
        run: |
          echo "outcome: $OUTCOME"
          echo "force_continued: $FORCE_CONTINUED"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (same-branch-only=false, no competing runs or sentinel repo)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
