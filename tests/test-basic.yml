name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          poll-interval-seconds: "5"
          continue-after-seconds: "10"
          same-branch-only: "true"
      - name: Assert action ran and produced expected outputs or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FORCE_CONTINUED: ${{ steps.action.outputs.force_continued }}
          PREV_RUN_ID: ${{ steps.action.outputs.previous_run_id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "force_continued: $FORCE_CONTINUED"
          echo "previous_run_id: $PREV_RUN_ID"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
            # If it succeeded, force_continued should be a boolean string
            if [ -n "$FORCE_CONTINUED" ]; then
              echo "force_continued output: $FORCE_CONTINUED"
              if [ "$FORCE_CONTINUED" != "true" ] && [ "$FORCE_CONTINUED" != "false" ]; then
                echo "FAIL: force_continued should be 'true' or 'false', got: $FORCE_CONTINUED"
                exit 1
              fi
              echo "PASS: force_continued is valid"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
