name: Test abort-after-seconds
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: turnstyle
        uses: .
        continue-on-error: true
        with:
          poll-interval-seconds: '5'
          abort-after-seconds: '10'
          same-branch-only: 'true'

      - name: Assert action ran and handled abort-after-seconds
        env:
          OUTCOME: ${{ steps.turnstyle.outcome }}
          FORCE_CONTINUED: ${{ steps.turnstyle.outputs.force_continued }}
        run: |
          echo "outcome: $OUTCOME"
          echo "force_continued: $FORCE_CONTINUED"
          if [ "$OUTCOME" = "success" ]; then
            # No competing runs found, action proceeded immediately
            # force_continued should be "false" (abort-after-seconds, not continue-after-seconds)
            if [ "$FORCE_CONTINUED" != "false" ] && [ -n "$FORCE_CONTINUED" ]; then
              echo "FAIL: expected force_continued to be 'false' or empty when using abort-after-seconds, got: '$FORCE_CONTINUED'"
              exit 1
            fi
            echo "PASS: action succeeded (no competing runs), force_continued=$FORCE_CONTINUED"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo not resolvable, or aborted after timeout)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
