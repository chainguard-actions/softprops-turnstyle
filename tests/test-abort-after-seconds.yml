name: Test abort-after-seconds
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          poll-interval-seconds: "5"
          abort-after-seconds: "10"
          same-branch-only: "true"
      - name: Assert action aborted or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FORCE_CONTINUED: ${{ steps.action.outputs.force_continued }}
        run: |
          echo "outcome: $OUTCOME"
          echo "force_continued: $FORCE_CONTINUED"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (no competing runs found)"
            # When abort-after-seconds is used and action succeeds, force_continued should be false
            if [ -n "$FORCE_CONTINUED" ] && [ "$FORCE_CONTINUED" != "false" ]; then
              echo "FAIL: expected force_continued to be 'false' when action succeeded without aborting"
              exit 1
            fi
            echo "PASS: force_continued is correct"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed (aborted after timeout or sentinel repo not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
