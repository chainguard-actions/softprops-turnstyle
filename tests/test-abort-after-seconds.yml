name: Test abort-after-seconds
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          poll-interval-seconds: '5'
          abort-after-seconds: '8'
          same-branch-only: 'false'
      - name: Assert action failed (abort timeout or sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FORCE_CONTINUED: ${{ steps.action.outputs.force_continued }}
        run: |
          echo "outcome: $OUTCOME"
          echo "force_continued: $FORCE_CONTINUED"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (abort timeout or sentinel repo not resolvable)"
          elif [ "$OUTCOME" = "success" ]; then
            # If no competing runs were found, the action may succeed immediately
            # In that case force_continued should be false (abort path doesn't set it)
            echo "PASS: action succeeded immediately (no competing runs found)"
            if [ "$FORCE_CONTINUED" = "true" ]; then
              echo "FAIL: force_continued should not be true on abort path"
              exit 1
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
