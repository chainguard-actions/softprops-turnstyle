name: Test retries input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          poll-interval-seconds: "5"
          continue-after-seconds: "10"
          retries: "3"
          same-branch-only: "true"
      - name: Assert action ran with retries configured or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FORCE_CONTINUED: ${{ steps.action.outputs.force_continued }}
        run: |
          echo "outcome: $OUTCOME"
          echo "force_continued: $FORCE_CONTINUED"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with retries=3"
            if [ -n "$FORCE_CONTINUED" ]; then
              if [ "$FORCE_CONTINUED" != "true" ] && [ "$FORCE_CONTINUED" != "false" ]; then
                echo "FAIL: force_continued should be 'true' or 'false', got: $FORCE_CONTINUED"
                exit 1
              fi
              echo "PASS: force_continued output is valid: $FORCE_CONTINUED"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
