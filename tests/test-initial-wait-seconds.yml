name: Test initial-wait-seconds input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          initial-wait-seconds: "5"
          same-branch-only: "false"
          continue-after-seconds: "10"
        continue-on-error: true
      - name: Assert action completed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FORCE_CONTINUED: ${{ steps.action.outputs.force_continued }}
        run: |
          echo "outcome: $OUTCOME"
          echo "force_continued: $FORCE_CONTINUED"
          if [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: action failed unexpectedly"
            exit 1
          fi
          echo "PASS: action completed with outcome=$OUTCOME"
