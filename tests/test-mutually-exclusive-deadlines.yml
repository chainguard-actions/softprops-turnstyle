name: Test continue and abort deadlines are mutually exclusive
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          continue-after-seconds: "10"
          abort-after-seconds: "10"
      - name: Assert step failed on invalid input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FORCE: ${{ steps.action.outputs.force_continued }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when both deadlines are set"
            exit 1
          fi
          if [ -n "$FORCE" ]; then
            echo "FAIL: force_continued should not be set"
            exit 1
          fi
          echo "PASS"
