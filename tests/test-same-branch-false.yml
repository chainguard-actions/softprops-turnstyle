name: Test same-branch-only false with queue-name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: turnstyle
        uses: .
        continue-on-error: true
        with:
          poll-interval-seconds: '5'
          continue-after-seconds: '10'
          same-branch-only: 'false'
          queue-name: 'test-queue'

      - name: Assert action ran with same-branch-only=false and queue-name
        env:
          OUTCOME: ${{ steps.turnstyle.outcome }}
          FORCE_CONTINUED: ${{ steps.turnstyle.outputs.force_continued }}
        run: |
          echo "outcome: $OUTCOME"
          echo "force_continued: $FORCE_CONTINUED"
          if [ "$OUTCOME" = "success" ]; then
            # Action succeeded - force_continued should be "true" or "false"
            if [ "$FORCE_CONTINUED" != "true" ] && [ "$FORCE_CONTINUED" != "false" ]; then
              echo "FAIL: expected force_continued to be 'true' or 'false', got: '$FORCE_CONTINUED'"
              exit 1
            fi
            echo "PASS: action succeeded with force_continued=$FORCE_CONTINUED"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
